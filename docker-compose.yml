# Citizen 360 SSO POC — one command:
#
#   docker compose up -d --build
#
# Same compose project ("namespace") for Keycloak and ClickHouse, but neither
# depends on the other to start or keep running:
#   * keycloak depends only on keycloak-db. It reaches Citizen 360 through the
#     Resolver over HTTP at login time; if the Resolver or ClickHouse is down the
#     login form says "try again" and Keycloak stays up.
#   * clickhouse depends on nothing. The resolver has no depends_on either; it
#     answers 503 "try again" while ClickHouse is away.
#   * only the one-shot `seed` job waits for everything.
#
# Ports (all bound to 127.0.0.1):
#   7080  Keycloak (realm "citizen"; admin console at /admin)
#   7090  Resolver API
#   7123  ClickHouse HTTP
#   Citizen-facing (My Guyana and the portals it links to):
#   7200  My Guyana             7201  NIS portal          7203  GRO portal
#   7204  Passport portal       7205  MPS Scholarships
#   7101  NIS registry API      7103  GRO registry API
#   7104  Passport registry API 7105  Scholarships registry API
#   Public-service staff (not part of My Guyana):
#   7202  MPS Workforce         7102  MPS registry API

name: citizen360

x-registry-env: &registry-env
  PORT: "8080"
  REGISTRY_API_KEY: ${REGISTRY_API_KEY:-poc-registry-api-key}
  KEYCLOAK_ISSUER: http://localhost:7080/realms/citizen
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  KEYCLOAK_REALM: citizen
  RESOLVER_URL: http://resolver:8090
  RESOLVER_SERVICE_KEY: ${RESOLVER_SERVICE_KEY:-poc-resolver-service-key}
  CORS_ORIGINS: http://localhost:7200,http://localhost:7201,http://localhost:7203,http://localhost:7204,http://localhost:7205

x-registry-api: &registry-api
  build: ./registry-api
  image: citizen360-registry-api:latest
  restart: unless-stopped
  depends_on:
    registry-db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 30

x-portal-env: &portal-env
  KEYCLOAK_URL: http://localhost:7080
  KEYCLOAK_REALM: citizen
  RESOLVER_URL: http://localhost:7090
  NIS_API_URL: http://localhost:7101
  MPS_API_URL: http://localhost:7102
  GRO_API_URL: http://localhost:7103
  PASSPORT_API_URL: http://localhost:7104
  SCHOLARSHIPS_API_URL: http://localhost:7105
  # Citizen-facing portals only. MPS Workforce is a staff portal and isn't linked from here.
  LINKS: >-
    [{"kind":"myguyana","title":"My Guyana","url":"http://localhost:7200","note":"360 view · any government ID"},
     {"kind":"nis","title":"NIS Portal","url":"http://localhost:7201","note":"NIS number only"},
     {"kind":"gro","title":"GRO Portal","url":"http://localhost:7203","note":"any government ID"},
     {"kind":"passport","title":"Passport Portal","url":"http://localhost:7204","note":"passport number only"},
     {"kind":"scholarships","title":"MPS Scholarships","url":"http://localhost:7205","note":"email (basic) or any ID"}]

# One image for every citizen-facing portal (My Guyana, NIS, GRO, Passport, Scholarships).
x-portal: &portal
  build: ./portal
  image: citizen360-portal:latest
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- IAM ----
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-change-me-keycloak-db}
    volumes:
      - kcdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    build: ./keycloak
    image: citizen360-keycloak:latest
    command: ["start", "--optimized", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-change-me-keycloak-db}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-change-me-admin}
      # Local prod-pattern: plain HTTP here, TLS terminates at the ingress in real deploys.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:7080
      KC_HEALTH_ENABLED: "true"
      # Citizen 360 authenticator SPI -> Resolver (never ClickHouse directly).
      CITIZEN_RESOLVER_URL: http://resolver:8090
      CITIZEN_RESOLVER_KEY: ${RESOLVER_SERVICE_KEY:-poc-resolver-service-key}
      CITIZEN_RESOLVER_TIMEOUT_MS: "3000"
    ports:
      - "127.0.0.1:7080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # --------------------------------------------------------- Citizen 360 ----
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: citizen360
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-change-me-clickhouse-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      RESOLVER_CH_PASSWORD: ${RESOLVER_CH_PASSWORD:-change-me-resolver-ch}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:7123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  resolver:
    build: ./resolver
    image: citizen360-resolver:latest
    restart: unless-stopped
    environment:
      PORT: "8090"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: resolver
      CLICKHOUSE_PASSWORD: ${RESOLVER_CH_PASSWORD:-change-me-resolver-ch}
      CLICKHOUSE_DB: citizen360
      RESOLVER_SERVICE_KEY: ${RESOLVER_SERVICE_KEY:-poc-resolver-service-key}
      KEYCLOAK_ISSUER: http://localhost:7080/realms/citizen
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      CORS_ORIGINS: http://localhost:7200,http://localhost:7201,http://localhost:7202,http://localhost:7203,http://localhost:7204,http://localhost:7205
    ports:
      - "127.0.0.1:7090:8090"
    # No depends_on: the Resolver starts and stays up whether or not ClickHouse is.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------- Registries ----
  registry-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:-change-me-registry-db}
    volumes:
      - regdata:/var/lib/postgresql/data
      - ./registry-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 5s
      retries: 20

  nis-api:
    <<: *registry-api
    environment:
      <<: *registry-env
      REGISTRY: nis
      DATABASE_URL: postgres://registry:${REGISTRY_DB_PASSWORD:-change-me-registry-db}@registry-db:5432/nis_registry
      AZP_ALLOWED: nis-portal,my-guyana
    ports:
      - "127.0.0.1:7101:8080"

  # Public-service workforce register: only MPS Workforce may call it (not My Guyana).
  mps-api:
    <<: *registry-api
    environment:
      <<: *registry-env
      REGISTRY: mps
      DATABASE_URL: postgres://registry:${REGISTRY_DB_PASSWORD:-change-me-registry-db}@registry-db:5432/mps_registry
      AZP_ALLOWED: mps-portal
      CORS_ORIGINS: http://localhost:7202
    ports:
      - "127.0.0.1:7102:8080"

  gro-api:
    <<: *registry-api
    environment:
      <<: *registry-env
      REGISTRY: gro
      DATABASE_URL: postgres://registry:${REGISTRY_DB_PASSWORD:-change-me-registry-db}@registry-db:5432/gro_registry
      AZP_ALLOWED: gro-portal,my-guyana
    ports:
      - "127.0.0.1:7103:8080"

  passport-api:
    <<: *registry-api
    environment:
      <<: *registry-env
      REGISTRY: passport
      DATABASE_URL: postgres://registry:${REGISTRY_DB_PASSWORD:-change-me-registry-db}@registry-db:5432/passport_registry
      AZP_ALLOWED: passport-portal,my-guyana
    ports:
      - "127.0.0.1:7104:8080"

  scholarships-api:
    <<: *registry-api
    environment:
      <<: *registry-env
      REGISTRY: scholarships
      DATABASE_URL: postgres://registry:${REGISTRY_DB_PASSWORD:-change-me-registry-db}@registry-db:5432/scholarships_registry
      AZP_ALLOWED: mps-scholarships,my-guyana
    ports:
      - "127.0.0.1:7105:8080"

  # ------------------------------------------------------------- Portals ----
  my-guyana:
    <<: *portal
    environment:
      <<: *portal-env
      CLIENT_ID: my-guyana
      PORTAL_KIND: myguyana
      PORTAL_TITLE: My Guyana
      PORTAL_SUBTITLE: Citizen 360 · all your government records
    ports:
      - "127.0.0.1:7200:80"

  nis-portal:
    <<: *portal
    environment:
      <<: *portal-env
      CLIENT_ID: nis-portal
      PORTAL_KIND: nis
      PORTAL_TITLE: NIS Portal
      PORTAL_SUBTITLE: National Insurance Scheme
    ports:
      - "127.0.0.1:7201:80"


  gro-portal:
    <<: *portal
    environment:
      <<: *portal-env
      CLIENT_ID: gro-portal
      PORTAL_KIND: gro
      PORTAL_TITLE: GRO Portal
      PORTAL_SUBTITLE: General Register Office
    ports:
      - "127.0.0.1:7203:80"

  passport-portal:
    <<: *portal
    environment:
      <<: *portal-env
      CLIENT_ID: passport-portal
      PORTAL_KIND: passport
      PORTAL_TITLE: Passport Portal
      PORTAL_SUBTITLE: Passport Office
    ports:
      - "127.0.0.1:7204:80"

  mps-scholarships:
    <<: *portal
    environment:
      <<: *portal-env
      CLIENT_ID: mps-scholarships
      PORTAL_KIND: scholarships
      PORTAL_TITLE: MPS Scholarships
      PORTAL_SUBTITLE: Ministry of Public Service · citizen scholarships
    ports:
      - "127.0.0.1:7205:80"

  # --------------------------------------------- Public-service staff ----
  # MPS Workforce: its own frontend, not part of My Guyana. Same realm, so SSO works,
  # but the client needs acr "high" (EID step-up).
  mps-portal:
    build: ./mps-workforce
    image: citizen360-mps-workforce:latest
    restart: unless-stopped
    environment:
      KEYCLOAK_URL: http://localhost:7080
      KEYCLOAK_REALM: citizen
      CLIENT_ID: mps-portal
      RESOLVER_URL: http://localhost:7090
      MPS_API_URL: http://localhost:7102
    ports:
      - "127.0.0.1:7202:80"

  # ----------------------------------------------------------- Seed job ----
  # Links the registries into Citizen 360 and creates the Keycloak test users.
  # Runs once per `up`; safe to re-run (`docker compose run --rm seed`).
  seed:
    build: ./seed
    image: citizen360-seed:latest
    restart: "no"
    environment:
      RESOLVER_URL: http://resolver:8090
      RESOLVER_SERVICE_KEY: ${RESOLVER_SERVICE_KEY:-poc-resolver-service-key}
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:-poc-registry-api-key}
      NIS_API_URL: http://nis-api:8080
      MPS_API_URL: http://mps-api:8080
      GRO_API_URL: http://gro-api:8080
      PASSPORT_API_URL: http://passport-api:8080
      SCHOLARSHIPS_API_URL: http://scholarships-api:8080
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:-admin}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:-change-me-clickhouse-admin}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: citizen
      KC_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-change-me-admin}
    depends_on:
      keycloak:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      resolver:
        condition: service_healthy
      nis-api:
        condition: service_healthy
      mps-api:
        condition: service_healthy
      gro-api:
        condition: service_healthy
      passport-api:
        condition: service_healthy
      scholarships-api:
        condition: service_healthy

volumes:
  kcdata:
  chdata:
  regdata:
